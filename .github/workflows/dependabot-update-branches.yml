name: Dependabot update branches

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened]
  workflow_dispatch:

concurrency:
  group: dependabot-update-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: >
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT }}

      - name: Rebase out-of-date Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT }}
        run: |
          set -euo pipefail

          base="main"

          git config user.name "voomdoon-bot"
          git config user.email "197564626+voomdoon-bot@users.noreply.github.com"
          git fetch origin "$base"

          prs="$(gh pr list \
            --state open \
            --base "$base" \
            --author "dependabot[bot]" \
            --json number,headRefName,headRepositoryOwner \
            --limit 100)"

          count="$(echo "$prs" | jq 'length')"
          echo "Found $count open Dependabot PR(s) targeting $base."

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            number="$(echo "$pr" | jq -r '.number')"
            branch="$(echo "$pr" | jq -r '.headRefName')"
            owner="$(echo "$pr" | jq -r '.headRepositoryOwner.login')"

            if [ "$owner" != "${{ github.repository_owner }}" ]; then
              echo "Skipping PR #$number from $owner/$branch because it is not in this repository owner."
              continue
            fi

            echo "Rebasing PR #$number branch $branch onto origin/$base."

            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"

            if git merge-base --is-ancestor "origin/$base" HEAD; then
              echo "PR #$number is already up to date."
              continue
            fi

            if git rebase "origin/$base"; then
              git push --force-with-lease origin "HEAD:$branch"
              echo "Rebased PR #$number."
            else
              git rebase --abort
              echo "::warning::Could not rebase PR #$number cleanly."
            fi
          done
